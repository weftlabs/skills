name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request replaces the older run:
# validation reads the pushed tree, so a superseded run has no value.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate skill frontmatter and links
        run: python3 scripts/validate.py
      - name: Validate session preview rendering
        run: |
          python3 -m pip install -r tools/session-preview/requirements.txt
          python3 -m unittest discover -s tools/session-preview -p 'test_*.py'
          python3 tools/session-preview/render.py build examples/session-previews --output /tmp/skill-previews
