version: 1
prompts:
  - title: "Turn a public profile into a sourced lead"
    prompt: |-
      Enrich this public LinkedIn profile. Return current role and company, a likely work email, its verification result and relevant public professional signals. Separate facts from inferences. Do not contact the person.
      
      Input data
      LinkedIn profile URL:
      Research goal (optional):
      Output: concise lead brief with sources

