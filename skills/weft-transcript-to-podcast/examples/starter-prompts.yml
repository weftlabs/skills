version: 1
prompts:
  - title: "Turn saved source text into a short narrated MP3 recap"
    prompt: |-
      Turn this saved transcript into a short audio recap. Use Weft to generate narration through BlockRun. Include the script and source notes. Keep the original transcript unchanged and do not buy it again.
      
      Input data
      Transcript file or text:
      Target duration: five minutes
      Voice: available stock voice
      Language: same as the transcript
