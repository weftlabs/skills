version: 1
prompts:
  - title: "Compare flights with baggage and transfer costs"
    prompt: |-
      Find the cheapest flight connection for this trip. Compare total costs including baggage and needed airport transfers. Show schedules, sources and any unknown prices. Do not book anything.
      
      Input data
      From:
      To:
      Departure date:
      Return date: one-way unless supplied
      Passengers: 1 adult
      Baggage: small personal item only
      Date flexibility: exact dates
      Preferences: lowest total cost; explain connections

